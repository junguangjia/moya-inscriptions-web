      try {
        const theme = localStorage.getItem("yoyi.theme-preference");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        const layout = localStorage.getItem("yoyi.home-feed-layout");
        document.documentElement.dataset.homeLayout =
          layout === "single" ? "single" : "double";
      } catch {
        document.documentElement.dataset.homeLayout = "double";
      }
