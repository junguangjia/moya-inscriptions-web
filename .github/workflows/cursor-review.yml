name: Cursor review
run-name: >-
  ${{ inputs.operation == 'dialogue' && format('cursor-dialogue {0} round {1}',
  fromJSON(inputs.dialogue_request).dialogueId,
  fromJSON(inputs.dialogue_request).round) || 'Cursor review' }}

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository PR number to review
        required: false
        type: string
      operation:
        description: Review a PR, or inspect model metadata without inference
        type: choice
        default: review
        options: [review, question, inspect-models, diagnose-ci, dialogue]
      question_request:
        description:
          'Natural question as JSON {"question":"...","replyTo":123}; replyTo
          optional'
        type: string
      dialogue_request:
        description:
          Sanitized exact-source question and cached evidence (60 KiB)
        type: string
      ci_run:
        description: Failed canonical CI run ID (diagnose-ci only)
        type: string
      ci_attempt:
        description: Exact CI run attempt (diagnose-ci only)
        type: string
      expected_head:
        description: Exact current PR head SHA (question or diagnose-ci)
        type: string
      base_ref:
        description: Exact current PR base branch (diagnose-ci only)
        type: string
      source_paths:
        description:
          Up to 8 comma-separated code paths or path:start-end ranges
          (diagnose-ci only)
        type: string
      ci_evidence:
        description:
          Optional exact-head/run/attempt-bound native observation JSON (8 KiB
          maximum)
        type: string

permissions: {}

env:
  CURSOR_OPERATION: ${{ inputs.operation }}
  CURSOR_AUTOMATION_ENABLED: ${{ vars.CURSOR_AUTOMATION_ENABLED }}
  CONFIDENTIALITY_BATCH_ID:
    cursor-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  route:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/main') || (github.event_name != 'workflow_dispatch' &&
      vars.CURSOR_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      ready: ${{ steps.route.outputs.ready }}
      pr: ${{ steps.route.outputs.pr }}
      trusted: ${{ steps.route.outputs.trusted }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - id: route
        env:
          GH_TOKEN: # Ephemeral GitHub token reference, never a literal.
            ${{ github.token }}
        run: node scripts/cursor-review.mjs route
  prepare:
    needs: route
    if: needs.route.outputs.ready == 'true'
    concurrency:
      group: cursor-${{ github.repository }}-pr-${{ needs.route.outputs.pr }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: write
    env:
      CURSOR_WORKFLOW_SHA: ${{ needs.route.outputs.trusted }}
      CURSOR_AUTONOMOUS: "true"
    outputs:
      ready: ${{ steps.context.outputs.ready }}
      inference: ${{ steps.context.outputs.inference }}
      models: ${{ steps.context.outputs.models }}
      transfer: ${{ steps.transfer.outputs.present }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.route.outputs.trusted }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Provision existing core checks once
        run: |
          timeout --kill-after=5s 115s bash -euo pipefail -c '
            git config --local user.name nontwo
            git config --local user.email 163475477+nontwo@users.noreply.github.com
            git config --local user.useConfigOnly true
            node scripts/install-confidentiality-hooks.mjs --confirm-current-identity-approved
          '
      - name: Resolve target and claim existing dedup identity
        id: context
        env:
          GH_TOKEN: # Ephemeral GitHub token reference, never a literal.
            ${{ github.token }}
        run: |
          if [ "$CURSOR_OPERATION" = dialogue ]; then
            node scripts/cursor-dialogue.mjs prepare
          else
            node scripts/cursor-review.mjs prepare
          fi
      - name: Transfer existing sanitized admission records
        if: always()
        id: transfer
        run: node scripts/cursor-review.mjs transfer
      - if: always() && steps.transfer.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cursor-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path:
            ${{ runner.temp }}/cursor-${{ inputs.operation == 'dialogue' &&
            'dialogue' || 'review' }}/transfer/
          retention-days: 7
  analyze:
    needs: [route, prepare]
    if: >-
      github.run_attempt == 1 && (needs.prepare.outputs.inference == 'true' ||
      needs.prepare.outputs.models == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # Platform ceiling, not an inference timer.
    # The model job has only this repository's ephemeral read permissions.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    env:
      CURSOR_WORKFLOW_SHA: ${{ needs.route.outputs.trusted }}
      CURSOR_AUTONOMOUS:
        ${{ inputs.operation != 'dialogue' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.route.outputs.trusted }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - if: needs.prepare.outputs.transfer == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cursor-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path:
            ${{ runner.temp }}/cursor-${{ inputs.operation == 'dialogue' &&
            'dialogue' || 'review' }}/
      - name: Install pinned official Cursor CLI
        id: install
        if:
          needs.prepare.outputs.inference == 'true' ||
          needs.prepare.outputs.models == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 120 \
            https://downloads.cursor.com/lab/2026.10.01-e373342/linux/x64/agent-cli-package.tar.gz \
            -o "$RUNNER_TEMP/cursor-cli.tar.gz"
          echo "a79726c6e644520e993970be4c45775a6889802b67abe461a677a53219ae28e8  $RUNNER_TEMP/cursor-cli.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/cursor-cli"
          tar --strip-components=1 -xzf "$RUNNER_TEMP/cursor-cli.tar.gz" -C "$RUNNER_TEMP/cursor-cli"
          echo "CURSOR_AGENT_BIN=$RUNNER_TEMP/cursor-cli/cursor-agent" >> "$GITHUB_ENV"
      - name: Install pinned official GitHub MCP directly
        if:
          inputs.operation != 'dialogue' && inputs.operation != 'inspect-models'
          && inputs.operation != 'diagnose-ci'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/github/github-mcp-server/releases/download/v1.14.0/github-mcp-server_Linux_x86_64.tar.gz \
            -o "$RUNNER_TEMP/github-mcp.tar.gz"
          echo "2fcad56bb164b6c4918fdd9f1d5572257bf4e1f14b7eb1119d015b079818fd38  $RUNNER_TEMP/github-mcp.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/github-mcp"
          tar -xzf "$RUNNER_TEMP/github-mcp.tar.gz" -C "$RUNNER_TEMP/github-mcp" github-mcp-server
          echo "CURSOR_GITHUB_MCP_BIN=$RUNNER_TEMP/github-mcp/github-mcp-server" >> "$GITHUB_ENV"
      - name: Recheck exact source and claim before inference
        id: fresh
        if: needs.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: # Ephemeral GitHub token reference, never a literal.
            ${{ github.token }}
        run: |
          if [ "$CURSOR_OPERATION" = dialogue ]; then
            node scripts/cursor-dialogue.mjs fresh
          else
            node scripts/cursor-review.mjs fresh
          fi
      - name: Analyze with official Cursor and included usage
        id: inference
        if:
          steps.fresh.outputs.ready == 'true' || needs.prepare.outputs.models ==
          'true'
        env:
          CURSOR_API_KEY: # Resolved by GitHub; never a literal credential.
            ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          CURSOR_GITHUB_READ_TOKEN: # Read-only job token reference for official MCP.
            ${{ github.token }}
        run: |
          if [ "$CURSOR_OPERATION" = dialogue ]; then
            node scripts/cursor-dialogue.mjs analyze
          elif [ "$CURSOR_OPERATION" = inspect-models ]; then
            node scripts/cursor-review.mjs models
          else
            node scripts/cursor-review.mjs analyze
          fi
      - name: Retain scanned response and actual official progress
        if: always()
        id: transfer
        run: node scripts/cursor-review.mjs transfer
      - if: always() && steps.transfer.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cursor-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path:
            ${{ runner.temp }}/cursor-${{ inputs.operation == 'dialogue' &&
            'dialogue' || 'review' }}/transfer/
          retention-days: 7
  publish:
    needs: [route, prepare, analyze]
    if: always() && needs.prepare.outputs.transfer == 'true'
    concurrency:
      group: cursor-${{ github.repository }}-pr-${{ needs.route.outputs.pr }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: write
    env:
      CURSOR_WORKFLOW_SHA: ${{ needs.route.outputs.trusted }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.route.outputs.trusted }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cursor-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path:
            ${{ runner.temp }}/cursor-${{ inputs.operation == 'dialogue' &&
            'dialogue' || 'review' }}/
      - if: needs.analyze.result != 'skipped'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true # Missing result is published as unavailable, never retried.
        with:
          name: cursor-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path:
            ${{ runner.temp }}/cursor-${{ inputs.operation == 'dialogue' &&
            'dialogue' || 'review' }}/
      - name: Provision existing core checks once
        run: |
          timeout --kill-after=5s 115s bash -euo pipefail -c '
            git config --local user.name nontwo
            git config --local user.email 163475477+nontwo@users.noreply.github.com
            git config --local user.useConfigOnly true
            node scripts/install-confidentiality-hooks.mjs --confirm-current-identity-approved
          '
      - name: Publish revision-bound reply and concise summary
        id: publish
        if: needs.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: # Ephemeral GitHub token reference, never a literal.
            ${{ github.token }}
        run: |
          timeout --kill-after=5s 115s bash -euo pipefail -c '
            if [ "$CURSOR_OPERATION" = dialogue ]; then
              node scripts/cursor-dialogue.mjs publish
            else
              node scripts/cursor-review.mjs publish
            fi
          '
      - name: Retain sanitized terminal receipt
        if: always() && inputs.operation != 'dialogue'
        env:
          GH_TOKEN: # Ephemeral GitHub token reference, never a literal.
            ${{ github.token }}
          CURSOR_PREPARE_OUTCOME: ${{ needs.prepare.result }}
          CURSOR_ANALYZE_OUTCOME: ${{ needs.analyze.result }}
          CURSOR_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: node scripts/cursor-review.mjs retain
      - if: always() && inputs.operation != 'dialogue'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cursor-automatic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cursor-review/remote-output/
          retention-days: 7
          if-no-files-found: ignore
      - if: always() && inputs.operation == 'dialogue'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name:
            cursor-dialogue-${{ fromJSON(inputs.dialogue_request).dialogueId
            }}-${{ fromJSON(inputs.dialogue_request).round }}
          path: ${{ runner.temp }}/cursor-dialogue/output/
          retention-days: 7
          if-no-files-found: warn
