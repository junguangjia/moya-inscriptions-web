name: Cursor review
run-name: >-
  ${{ inputs.operation == 'dialogue' && format('cursor-dialogue {0} round {1}',
  fromJSON(inputs.dialogue_request).dialogueId,
  fromJSON(inputs.dialogue_request).round) || 'Cursor review' }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository PR number to review
        required: false
        type: string
      operation:
        description: Review a PR, or inspect model metadata without inference
        type: choice
        default: review
        options: [review, inspect-models, diagnose-ci, dialogue]
      dialogue_request:
        description: Reviewed candidate dialogue request JSON (60 KiB maximum)
        type: string
      ci_run:
        description: Failed canonical CI run ID (diagnose-ci only)
        type: string
      ci_attempt:
        description: Exact CI run attempt (diagnose-ci only)
        type: string
      expected_head:
        description: Exact current PR head SHA (diagnose-ci only)
        type: string
      base_ref:
        description: Exact current PR base branch (diagnose-ci only)
        type: string
      source_paths:
        description:
          Up to 8 comma-separated code paths or path:start-end ranges
          (diagnose-ci only)
        type: string
      ci_evidence:
        description:
          Optional exact-head/run/attempt-bound native observation JSON (8 KiB
          maximum)
        type: string

permissions: {}

concurrency:
  group:
    cursor-${{ inputs.operation == 'dialogue' &&
    fromJSON(inputs.dialogue_request).dialogueId || github.event_name ==
    'workflow_dispatch' && inputs.operation == 'inspect-models' &&
    'model-catalog' || github.event_name == 'workflow_dispatch' &&
    inputs.operation == 'diagnose-ci' && format('ci-{0}', inputs.expected_head)
    || github.event_name == 'workflow_run' && format('ci-{0}',
    github.event.workflow_run.head_sha) || format('review-{0}',
    github.event.pull_request.number || inputs.pr) }}
  cancel-in-progress: ${{ inputs.operation != 'dialogue' }}

jobs:
  analyze:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation ==
      'dialogue' && github.ref == 'refs/heads/codex/cursor-bounded-dialogue') ||
      (github.event_name == 'workflow_dispatch' && (inputs.operation ==
      'inspect-models' || inputs.operation == 'diagnose-ci') && github.ref ==
      'refs/heads/main') || (vars.CURSOR_AUTOMATION_ENABLED != 'false' &&
      inputs.operation != 'dialogue' && (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # Normal operations use trusted main. The manual dialogue exception pins
      # an independently reviewed integration candidate, never media PR code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.operation == 'dialogue' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Collect current PR evidence
        id: context
        env:
          GH_TOKEN: # Ephemeral GitHub token for the deterministic collector.
            ${{ github.token }}
          CURSOR_AUTOMATION_ENABLED: ${{ vars.CURSOR_AUTOMATION_ENABLED }}
          CURSOR_OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$CURSOR_OPERATION" = dialogue ]; then
            node scripts/cursor-dialogue.mjs prepare
          else
            node scripts/cursor-review.mjs prepare
          fi
      - name: Install pinned official Cursor CLI
        if:
          steps.context.outputs.ready == 'true' || steps.context.outputs.models
          == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 120 \
            https://downloads.cursor.com/lab/2026.10.01-e373342/linux/x64/agent-cli-package.tar.gz \
            -o "$RUNNER_TEMP/cursor-cli.tar.gz"
          echo "a79726c6e644520e993970be4c45775a6889802b67abe461a677a53219ae28e8  $RUNNER_TEMP/cursor-cli.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/cursor-cli"
          tar --strip-components=1 -xzf "$RUNNER_TEMP/cursor-cli.tar.gz" -C "$RUNNER_TEMP/cursor-cli"
          echo "CURSOR_AGENT_BIN=$RUNNER_TEMP/cursor-cli/cursor-agent" >> "$GITHUB_ENV"
      - name: Skip work superseded during installation
        id: fresh
        if: steps.context.outputs.ready == 'true'
        env:
          GH_TOKEN: # Freshness checks run outside the agent process.
            ${{ github.token }}
          CURSOR_OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$CURSOR_OPERATION" = dialogue ]; then
            node scripts/cursor-dialogue.mjs fresh
          else
            node scripts/cursor-review.mjs fresh
          fi
      - name: Analyze with Cursor included usage
        if:
          steps.fresh.outputs.ready == 'true' || steps.context.outputs.models ==
          'true'
        env:
          CURSOR_API_KEY: # Resolved by GitHub; never a literal credential.
            ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL || 'composer-2.5' }}
          CURSOR_OPERATION:
            ${{ inputs.operation == 'dialogue' && 'dialogue' ||
            steps.context.outputs.models == 'true' && 'models' || 'analyze' }}
        run: |
          if [ "$CURSOR_OPERATION" = dialogue ]; then
            node scripts/cursor-dialogue.mjs analyze
          else
            node scripts/cursor-review.mjs "$CURSOR_OPERATION"
          fi
      - name: Publish concise revision-bound findings
        if: steps.fresh.outputs.ready == 'true'
        env:
          GH_TOKEN: # The agent never receives this publishing credential.
            ${{ github.token }}
          CONFIDENTIALITY_BATCH_ID:
            cursor-${{ github.run_id }}-${{ github.run_attempt }}
          CURSOR_OPERATION: ${{ inputs.operation }}
        # Fresh hosted checkout: provision the existing scanner once, preserving
        # the repository's approved anonymous identity. No commit or push occurs.
        # Preparation and publication share one real 120-second ceiling.
        run: |
          timeout --kill-after=5s 115s bash -euo pipefail -c '
            git config --local user.name nontwo
            git config --local user.email 163475477+nontwo@users.noreply.github.com
            git config --local user.useConfigOnly true
            node scripts/install-confidentiality-hooks.mjs --confirm-current-identity-approved
            if [ "$CURSOR_OPERATION" = dialogue ]; then
              node scripts/cursor-dialogue.mjs publish
            else
              node scripts/cursor-review.mjs publish
            fi
          '
      - name: Retain bounded dialogue records and verified original cache
        if: always() && inputs.operation == 'dialogue'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name:
            cursor-dialogue-${{ fromJSON(inputs.dialogue_request).dialogueId
            }}-${{ fromJSON(inputs.dialogue_request).round }}
          path: ${{ runner.temp }}/cursor-dialogue/output/
          retention-days: 7
          if-no-files-found: warn
