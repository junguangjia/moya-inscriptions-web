name: ArtVenn r13 manual native diagnostic
run-name: "r13 diagnostic only — source 7a2cba05 — workflow ${{ github.sha }}"

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artvenn-r13-native-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/media-r13-webkit-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Check out the immutable source being diagnosed
        uses: actions/checkout@v6
        with:
          ref: 7a2cba05b8596579fd1fcb6a58ba6ba9c018e8f1
          path: source
          persist-credentials: false
      - name: Set up the original pnpm selector
        uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - name: Set up the original Node selector
        uses: actions/setup-node@v6
        with:
          node-version-file: source/.nvmrc
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Prepare pinned dependencies and native engines once
        timeout-minutes: 11
        run: node diagnostic/tests/e2e/support/r13-native-diagnostic.mjs prepare source diag-evidence
      - name: Execute one diagnostic case within the feedback bound
        timeout-minutes: 3
        run: node diagnostic/tests/e2e/support/r13-native-diagnostic.mjs run source diag-evidence
      - name: Upload only allowlisted phase and outcome records
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: r13-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diag-evidence/preparation.json
            diag-evidence/feedback.json
            diag-evidence/control.json
          if-no-files-found: warn
          retention-days: 7
