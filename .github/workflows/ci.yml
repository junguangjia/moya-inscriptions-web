name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group:
    ${{ github.workflow }}-task-${{ github.event_name }}-${{ github.ref }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify_e2e:
    name: classify-task
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      web: ${{ steps.classify.outputs.web }}
      web_workspaces: ${{ steps.classify.outputs.web_workspaces }}
      cms: ${{ steps.classify.outputs.cms }}
      contracts: ${{ steps.classify.outputs.contracts }}
      apple: ${{ steps.classify.outputs.apple }}
      lightweight: ${{ steps.classify.outputs.lightweight }}
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Classify the complete task diff
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA:
            ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-task-scope.mjs

  lightweight:
    needs: classify_e2e
    if: needs.classify_e2e.outputs.lightweight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAN: ${{ needs.classify_e2e.outputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Validate task routing and affected documentation or tooling
        run: >-
          node scripts/verify-task.mjs --mode lightweight --output
          "$RUNNER_TEMP/workflow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve lightweight validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-${{ github.run_id }}-${{ github.run_attempt }}
          path:
            ${{ runner.temp }}/workflow-${{ github.run_id }}-${{
            github.run_attempt }}/summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  contracts:
    needs: classify_e2e
    if: needs.classify_e2e.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore content-hashed library builds
        uses: actions/cache@v4
        with:
          path: .turbo/library-cache
          key:
            library-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml',
            'turbo.json', 'tsconfig.base.json') }}-${{ github.sha }}-${{
            github.job }}
          restore-keys: |
            library-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json', 'tsconfig.base.json') }}-
      - name: Validate shared contracts and their existing consumers
        run: >-
          node scripts/verify-task.mjs --mode contracts --output
          "$RUNNER_TEMP/contracts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve shared-contract validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path:
            ${{ runner.temp }}/contracts-${{ github.run_id }}-${{
            github.run_attempt }}/summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  lint:
    needs: classify_e2e
    if: needs.classify_e2e.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOYA_VERIFY_WORKSPACES: ${{ needs.classify_e2e.outputs.web_workspaces }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Independent CI job with its own explicit WEB COMPLETE profile.
      - name: Complete formatting and lint
        run: node scripts/verify.mjs lint --profile complete

  typecheck:
    needs: classify_e2e
    if: needs.classify_e2e.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOYA_VERIFY_WORKSPACES: ${{ needs.classify_e2e.outputs.web_workspaces }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: node scripts/verify.mjs typecheck --profile complete

  test:
    needs: classify_e2e
    if: needs.classify_e2e.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOYA_VERIFY_WORKSPACES: ${{ needs.classify_e2e.outputs.web_workspaces }}
      DATABASE_URL: postgresql://moya_test:synthetic-ci-postgres-password@127.0.0.1:5432/moya_test
      TEST_DATABASE_URL: postgresql://moya_test:synthetic-ci-postgres-password@127.0.0.1:5432/moya_test
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: moya_test
          POSTGRES_PASSWORD: synthetic-ci-postgres-password
          POSTGRES_USER: moya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moya_test -d moya_test" --health-interval
          2s --health-timeout 3s --health-retries 20
      # PostgreSQL 16 is the minimum supported Production major; 18 above is
      # the newer one. Both run the same migrations and integration suite.
      postgres16:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: moya_test
          POSTGRES_PASSWORD: synthetic-ci-postgres-password
          POSTGRES_USER: moya_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U moya_test -d moya_test" --health-interval
          2s --health-timeout 3s --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore content-hashed library builds
        uses: actions/cache@v4
        with:
          path: .turbo/library-cache
          key:
            library-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml',
            'turbo.json', 'tsconfig.base.json') }}-${{ github.sha }}-${{
            github.job }}
          restore-keys: |
            library-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json', 'tsconfig.base.json') }}-
      - name: Mark the CI PostgreSQL service as a disposable test target
        run: >-
          docker exec -i "${{ job.services.postgres.id }}" psql -v
          ON_ERROR_STOP=1 -U moya_test -d moya_test -f -
          <infra/test/disposable-test-target.sql

      # Persistent opt-in for full PR and merged-main test runs only.
      # Preparation, all tests and cleanup share one 300-second deadline.
      - name: Complete CI test milestone within 300 seconds
        run: node scripts/verify.mjs test --ci-milestone

      - name: Mark the CI PostgreSQL 16 service as a disposable test target
        run: >-
          docker exec -i "${{ job.services.postgres16.id }}" psql -v
          ON_ERROR_STOP=1 -U moya_test -d moya_test -f -
          <infra/test/disposable-test-target.sql

      # The same migrations and PostgreSQL integration suite on the minimum
      # supported major, as their own explicit complete profile.
      - name: PostgreSQL 16 migrations and integration within 300 seconds
        env:
          DATABASE_URL: postgresql://moya_test:synthetic-ci-postgres-password@127.0.0.1:5433/moya_test
          TEST_DATABASE_URL: postgresql://moya_test:synthetic-ci-postgres-password@127.0.0.1:5433/moya_test
          TEST_DATABASE_EXPECTED_VERSION_NUM: "160015"
        run: node scripts/verify.mjs postgres --profile complete

  cms:
    name: cms
    needs: classify_e2e
    if: needs.classify_e2e.outputs.cms == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          # The name carries a whole "synthetic"/"test" segment, as the suite
          # guard requires; the step below adds the disposable marker.
          POSTGRES_DB: cms_synthetic_test
          POSTGRES_USER: cms_qa
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms_qa -d cms_synthetic_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
      # The minimum supported Production major, for the Payload checks below.
      postgres16:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: cms_synthetic_test
          POSTGRES_USER: cms_qa
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cms_qa -d cms_synthetic_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore content-hashed library builds
        uses: actions/cache@v4
        with:
          path: .turbo/library-cache
          key:
            library-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml',
            'turbo.json', 'tsconfig.base.json') }}-${{ github.sha }}-${{
            github.job }}
          restore-keys: |
            library-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'turbo.json', 'tsconfig.base.json') }}-
      - name: Mark the CI PostgreSQL service as a disposable test target
        run: >-
          docker exec -i "${{ job.services.postgres.id }}" psql -v
          ON_ERROR_STOP=1 -U cms_qa -d cms_synthetic_test -f -
          <infra/test/disposable-test-target.sql
      # Each CMS check is an independent explicit CMS COMPLETE profile.
      - name: Real Payload migrations and PostgreSQL integration
        env:
          # Explicitly fictional, isolated CI database; no cloud access.
          CMS_TEST_DATABASE_URL: postgresql://cms_qa@127.0.0.1:5432/cms_synthetic_test
        run: pnpm test:cms --profile complete
      - name: Mark the CI PostgreSQL 16 service as a disposable test target
        run: >-
          docker exec -i "${{ job.services.postgres16.id }}" psql -v
          ON_ERROR_STOP=1 -U cms_qa -d cms_synthetic_test -f -
          <infra/test/disposable-test-target.sql
      - name: Real Payload migrations and PostgreSQL 16 integration
        env:
          CMS_TEST_DATABASE_URL: postgresql://cms_qa@127.0.0.1:5433/cms_synthetic_test
        run: pnpm test:cms --profile complete
      - name: Prepare native Admin browser validation
        run: |
          pnpm --filter @moya/tests exec playwright install --with-deps --only-shell chromium
          pnpm --filter admin build
      - name: Native Owner create, publish, autosave, batch approval and restore
        env:
          CMS_TEST_DATABASE_URL: postgresql://cms_qa@127.0.0.1:5432/cms_synthetic_test
        run: pnpm test:cms:browser --profile complete
      - name: Native Owner browser flow on PostgreSQL 16
        env:
          CMS_TEST_DATABASE_URL: postgresql://cms_qa@127.0.0.1:5433/cms_synthetic_test
        run: pnpm test:cms:browser --profile complete
      # Mandatory, and last so the Production Admin browser check above runs
      # against a tree this harness has not touched. The harness owns
      # everything it uses: a database it creates beside the one named below,
      # its own SQL roles, its own authorization listener, its own Backend,
      # its own Admin dist directory and its own browser -- and it drops all
      # of them. It writes no artifact: the tokens and the Owner handoff stay
      # in a mode-restricted session directory that is removed on the way out.
      - name: Development OAuth consent, revocation and a real Backend tool read
        env:
          CMS_TEST_DATABASE_URL: postgresql://cms_qa@127.0.0.1:5432/cms_synthetic_test
        run: pnpm test:cms:agent-connections --profile complete

  build:
    needs: classify_e2e
    if: needs.classify_e2e.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOYA_VERIFY_WORKSPACES: ${{ needs.classify_e2e.outputs.web_workspaces }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: node scripts/verify.mjs build --profile complete

  apple:
    needs: classify_e2e
    if: needs.classify_e2e.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APPLE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # APPLE FULL profile: 600 s owned by the verifier. The step limit is
      # emergency containment, not additional native execution allowance.
      - name: Validate the selected native Apple project
        timeout-minutes: 12
        run: >-
          node scripts/verify-apple.mjs --profile full --output
          "$RUNNER_TEMP/apple-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve native Apple validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apple-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
            ${{ runner.temp }}/apple-${{ github.run_id }}-${{ github.run_attempt }}/phase-checkpoint.json
            ${{ runner.temp }}/apple-${{ github.run_id }}-${{ github.run_attempt }}/diagnostic.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e-shards:
    needs: classify_e2e
    if: needs.classify_e2e.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      MOYA_E2E_SOURCE_HEAD:
        ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies and browser engines
        timeout-minutes: 10
        run: node tests/e2e/support/e2e-ci.mjs prepare ${{ matrix.shard }}

      - name: Full browser regression shard
        # Native 18-minute deadline leaves teardown/report time before this cap.
        timeout-minutes: 22
        run: node tests/e2e/support/e2e-ci.mjs run ${{ matrix.shard }}

      - name: Upload shard reports, failures and service logs
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name:
            e2e-shard-${{ matrix.shard }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: .local/e2e-ci/shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e_smoke:
    needs: classify_e2e
    if: needs.classify_e2e.outputs.scope == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      MOYA_E2E_SOURCE_HEAD:
        ${{ github.event.pull_request.head.sha || github.sha }}
      MOYA_E2E_CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install smoke dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @moya/tests exec playwright install --with-deps --only-shell chromium
      # Cold complete BROWSER SMOKE: server startup, checks and cleanup inside
      # one explicit profile; the full cross-browser suite stays in e2e-shards.
      - name: Cold browser smoke
        env:
          MOYA_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.local/e2e-ci/smoke
        run: node scripts/verify.mjs e2e --profile complete
      - name: Preserve native smoke reports and failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/e2e-ci/smoke/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Browser validation retains its native report and exact collection gates.
  browser_gate:
    name: browser-gate
    if: ${{ always() }}
    needs: [classify_e2e, e2e_smoke, e2e-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOYA_E2E_SOURCE_HEAD:
        ${{ github.event.pull_request.head.sha || github.sha }}
      MOYA_E2E_SHARD_JOB_RESULT: ${{ needs.e2e-shards.result }}

    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        if: ${{ always() && needs.classify_e2e.outputs.scope == 'full' }}
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: ${{ always() }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache:
            ${{ needs.classify_e2e.outputs.scope == 'full' && 'pnpm' || '' }}

      - name: Require the selected browser execution
        env:
          SCOPE: ${{ needs.classify_e2e.outputs.scope }}
          CLASSIFY_RESULT: ${{ needs.classify_e2e.result }}
          SMOKE_RESULT: ${{ needs.e2e_smoke.result }}
          FULL_RESULT: ${{ needs.e2e-shards.result }}
        run: node scripts/ci-e2e-gate.mjs gate >>"$GITHUB_STEP_SUMMARY"

      - name: Install report tooling
        if: ${{ always() && needs.classify_e2e.outputs.scope == 'full' }}
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: Download this attempt's shard evidence
        if: ${{ always() && needs.classify_e2e.outputs.scope == 'full' }}
        uses: actions/download-artifact@v5
        with:
          pattern: e2e-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/e2e-ci/downloaded

      - name: Merge native reports and enforce complete result gate
        if: ${{ always() && needs.classify_e2e.outputs.scope == 'full' }}
        timeout-minutes: 5
        run: node tests/e2e/support/e2e-ci.mjs merge

      - name: Upload merged HTML, JSON and gate result
        if: ${{ always() && needs.classify_e2e.outputs.scope == 'full' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: e2e-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/e2e-ci/aggregate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Preserve the stable required context while enforcing every selected task job.
  e2e:
    if: ${{ always() }}
    needs:
      - classify_e2e
      - lightweight
      - contracts
      - lint
      - typecheck
      - test
      - cms
      - build
      - apple
      - browser_gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Require complete validation for the classified task
        env:
          PLAN: ${{ needs.classify_e2e.outputs.plan }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-task-gate.mjs >>"$GITHUB_STEP_SUMMARY"
